<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INFINITY DEV</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5fb;--card:#fff;--ink:#1a1a2e;--mut:#6b6b80;--ac:#4338ca;--on:#fff;--bd:#dcdbe8;--bad:#c0262d;--ok:#12805c;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12121c;--card:#1b1b2b;--ink:#ecebf7;--mut:#9a99b3;--ac:#8b8cff;--on:#12121c;--bd:#33334a;--bad:#ff7b81;--ok:#4fd1a1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12121c;--card:#1b1b2b;--ink:#ecebf7;--mut:#9a99b3;--ac:#8b8cff;--on:#12121c;--bd:#33334a;--bad:#ff7b81;--ok:#4fd1a1;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto}
header b{font-size:19px;margin-right:auto;white-space:nowrap}
button,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--card);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
button.d{color:var(--bad)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:16px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin:4px 0 12px}
label{font-size:14px;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.msg{min-height:22px;font-size:14px}.err{color:var(--bad)}.good{color:var(--ok)}
main.wide{max-width:1200px}
.ed{display:flex;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:8px 0;height:40vh;min-height:220px;overflow:hidden}
#ln{margin:0;padding:10px 8px;text-align:right;color:var(--mut);font:var(--fs,14px)/1.5 ui-monospace,Menlo,monospace;user-select:none;overflow:hidden;border-right:1px solid var(--bd);min-width:40px}
#code{flex:1;font:var(--fs,14px)/1.5 ui-monospace,Menlo,monospace;height:100%;resize:none;white-space:pre;tab-size:2;margin:0;border:0;border-radius:0;padding:10px;overflow:auto}
@media(min-width:900px){#wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ed{height:70vh}iframe{height:70vh!important;margin-top:8px}}
iframe{width:100%;height:36vh;min-height:220px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
h2{margin:0 0 12px}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ===== তোমার সেটিংস: এখানকার মান বদলালেই সাইট বদলে যাবে ===== */
const CONFIG={siteName:'INFINITY DEV',accent:'',fontSize:14};
let mem={users:[],projects:{},session:null,settings:{}};
const S=()=>({...CONFIG,...(mem.settings||{})});
function applySettings(){const s=S(),r=document.documentElement.style;document.title=s.siteName;r.setProperty('--fs',s.fontSize+'px');if(s.accent){r.setProperty('--ac',s.accent);r.setProperty('--on','#fff')}else{r.removeProperty('--ac');r.removeProperty('--on')}}
function load(){try{const r=localStorage.getItem('codeghor');if(r)mem={...mem,...JSON.parse(r)}}catch(e){}}
function save(){try{localStorage.setItem('codeghor',JSON.stringify(mem))}catch(e){}}
async function hash(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cg:'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(t)))}}
const me=()=>mem.users.find(u=>u.u===mem.session);
const START={html:'<h1>Hello, জগৎ!</h1>\n<button id="b">Click me</button>\n<p id="o"></p>',css:'body{font-family:sans-serif;text-align:center;padding:24px}\nh1{color:#4338ca}\nbutton{padding:10px 18px;font-size:16px}',js:'let n=0;\ndocument.getElementById("b").onclick=()=>{\n  n++;\n  document.getElementById("o").textContent="Clicked "+n+" times";\n};'};
let tab='html',view='editor',files=null,t;

function renderTop(){
  const u=me();
  $('#top').innerHTML='<b>'+esc(S().siteName)+'</b>'+(u?`<button data-v="editor" class="${view=='editor'?'on':''}">Editor</button><button data-v="profile" class="${view=='profile'?'on':''}">Profile</button>${u.role=='owner'?`<button data-v="settings" class="${view=='settings'?'on':''}">Settings</button><button data-v="admin" class="${view=='admin'?'on':''}">Admin</button>`:''}<button id="lo">Logout</button>`:'');
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  const lo=$('#lo');if(lo)lo.onclick=()=>{mem.session=null;save();render()};
}
function render(){applySettings();renderTop();const u=me();$('#app').className=u&&view=='editor'?'wide':'';if(!u)return auth();if(view=='profile')return profile(u);if(view=='settings'&&u.role=='owner')return settings(u);if(view=='admin'&&u.role=='owner')return admin(u);view='editor';editor(u)}

function auth(mode='login'){
  $('#app').innerHTML=`<div class="box"><h2>${mode=='login'?'Login':'নতুন অ্যাকাউন্ট'}</h2>
  <label>Username</label><input id="un" autocapitalize="off" autocomplete="username">
  <label>Password (কমপক্ষে 6 অক্ষর)</label><input id="pw" type="password" autocomplete="${mode=='login'?'current-password':'new-password'}">
  <div class="msg err" id="m"></div>
  <div class="row"><button class="p" id="go">${mode=='login'?'Login':'Create account'}</button><button id="sw">${mode=='login'?'Sign up':'Login'}</button></div>
  </div>`;
  $('#sw').onclick=()=>auth(mode=='login'?'signup':'login');
  $('#go').onclick=async()=>{
    const un=$('#un').value.trim().toLowerCase(),pw=$('#pw').value,m=$('#m');
    if(!/^[a-z0-9_]{3,20}$/.test(un))return m.textContent='Username: 3-20টি ইংরেজি অক্ষর, সংখ্যা বা _';
    if(pw.length<6)return m.textContent='Password কমপক্ষে 6 অক্ষরের হতে হবে';
    const h=await hash(pw),ex=mem.users.find(x=>x.u===un);
    if(mode=='signup'){
      if(ex)return m.textContent='এই username আগে থেকেই আছে';
      mem.users.push({u:un,p:h,name:un,bio:'',role:mem.users.length?'user':'owner',blocked:false});
    }else{
      if(!ex||ex.p!==h)return m.textContent='Username বা password ভুল';
      if(ex.blocked)return m.textContent='এই অ্যাকাউন্ট ব্লক করা আছে';
    }
    mem.session=un;files=null;view='editor';save();render();
  };
}

function editor(u){
  files=files||mem.projects[u.u]||{...START};
  $('#app').innerHTML=`<div class="row"><button data-t="html">index.html</button><button data-t="css">style.css</button><button data-t="js">script.js</button><span style="flex:1"></span><button class="p" id="sv">Save</button></div>
  <div id="wrap"><div class="ed"><pre id="ln"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" wrap="off"></textarea></div>
  <iframe id="pv" sandbox="allow-scripts" title="Preview"></iframe></div><div class="msg" id="m"></div>`;
  const ta=$('#code'),ln=$('#ln'),lines=()=>{ln.textContent=Array.from({length:ta.value.split('\n').length},(_,i)=>i+1).join('\n')};ta.onscroll=()=>{ln.scrollTop=ta.scrollTop};
  const setTab=x=>{tab=x;ta.value=files[x];lines();document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==x))};
  const run=()=>{$('#pv').srcdoc=`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>${files.css}</style></head><body>${files.html}<script>${files.js.replace(/<\/script/gi,'<\\/script')}<\/script></body></html>`};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  ta.oninput=()=>{files[tab]=ta.value;lines();clearTimeout(t);t=setTimeout(run,500)};ta.onkeydown=e=>{if(e.key=='Tab'){e.preventDefault();ta.setRangeText('  ',ta.selectionStart,ta.selectionEnd,'end');ta.oninput()}};
  $('#sv').onclick=()=>{mem.projects[u.u]=files;save();$('#m').textContent='Saved ✓';$('#m').className='msg good'};
  setTab(tab);run();
}

function profile(u){
  $('#app').innerHTML=`<div class="box"><h2>Profile</h2><span class="tag">${u.role=='owner'?'Owner':'User'}</span><p>@${esc(u.u)}</p>
  <label>Display name</label><input id="n" maxlength="40" value="${esc(u.name)}">
  <label>Bio</label><textarea id="b" rows="3" maxlength="200">${esc(u.bio)}</textarea>
  <div class="row"><button class="p" id="s">Save profile</button><span class="msg good" id="m"></span></div></div>`;
  $('#s').onclick=()=>{u.name=$('#n').value.trim()||u.u;u.bio=$('#b').value.trim();save();$('#m').textContent='Saved ✓'};
}

function settings(){
  const s=S(),cols=['#4338ca','#0f766e','#be123c','#b45309','#1d4ed8'];let pick=s.accent;
  $('#app').innerHTML=`<div class="box"><h2>Site settings</h2><label>Site name</label><input id="sn" maxlength="30" value="${esc(s.siteName)}"><label>Theme color</label><div class="row" style="margin:6px 0 14px">${cols.map(c=>`<button data-c="${c}" aria-label="${c}" style="background:${c};width:38px;height:38px;border-radius:99px;border:${s.accent==c?'3px solid var(--ink)':'1px solid var(--bd)'}"></button>`).join('')}<button data-c="">Default</button></div><label>Editor font size: <b id="fv">${s.fontSize}</b>px</label><input id="fs" type="range" min="11" max="22" value="${s.fontSize}"><div class="row"><button class="p" id="ss">Save settings</button><span class="msg good" id="m"></span></div></div>`;
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{pick=b.dataset.c;mem.settings={...mem.settings,accent:pick};applySettings();settings()});
  $('#fs').oninput=e=>{$('#fv').textContent=e.target.value};
  $('#ss').onclick=()=>{mem.settings={...mem.settings,siteName:$('#sn').value.trim()||CONFIG.siteName,accent:pick,fontSize:+$('#fs').value};save();applySettings();renderTop();$('#m').textContent='Saved ✓'};
}
function admin(){
  $('#app').innerHTML=`<div class="box"><h2>Admin panel</h2><div class="scroll"><table><tr><th>User</th><th>Role</th><th>Status</th><th></th></tr>${mem.users.map(x=>`<tr><td>${esc(x.name)}<br><small>@${esc(x.u)}</small></td><td>${x.role}</td><td>${x.blocked?'Blocked':'Active'}</td><td>${x.role=='owner'?'':`<button data-b="${esc(x.u)}">${x.blocked?'Unblock':'Block'}</button> <button class="d" data-r="${esc(x.u)}">Remove</button>`}</td></tr>`).join('')}</table></div></div>`;
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const x=mem.users.find(v=>v.u===b.dataset.b);x.blocked=!x.blocked;save();admin()});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(!confirm('@'+b.dataset.r+' কে রিমুভ করবে?'))return;mem.users=mem.users.filter(v=>v.u!==b.dataset.r);delete mem.projects[b.dataset.r];save();admin()});
}
load();render();
</script><script>
const ctx = new (window.AudioContext || window.webkitAudioContext)();

// browser-er rule: prothome ekbar touch/click/key lagbe
["pointerdown", "touchstart", "keydown", "wheel"].forEach(ev =>
  window.addEventListener(ev, () => ctx.state === "suspended" && ctx.resume(), { once: true, passive: true })
);

let lastPlay = 0;
function tick() {
  const now = performance.now();
  if (now - lastPlay < 25) return; // druto scroll-e jhaparo ropodh
  lastPlay = now;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = 700;
  gain.gain.setValueAtTime(0.08, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.04);
}

const LINE_HEIGHT = 24; // tomar page-er line-height (px)
let lastLine = -1;

window.addEventListener("scroll", () => {
  const line = Math.floor(window.scrollY / LINE_HEIGHT);
  if (line !== lastLine) {
    lastLine = line;
    tick();
  }
}, { passive: true });
</script>
</body>
</html>
